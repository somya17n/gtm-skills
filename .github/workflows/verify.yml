name: verify

# The suites this repo ships were runnable but nothing ran them. An unrun gate
# teaches the same lesson as an unsatisfiable one: that gates are optional.
# Every one of them exits non-zero on failure, so they gate directly.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structure, routing and CTA (every skill, no sampling)
        run: python scripts/verify-skills.py

      - name: Arithmetic guards still present (10 live fixtures)
        run: python scripts/regression-tests.py

      # qa-skills.py shipped runnable and exits 1 on a finding, but was never a step here, so
      # "four checks green" only ever meant four green on someone's laptop. It is a gate now.
      - name: Behavioural QA (first-run defects, every skill)
        run: python scripts/qa-skills.py

      # A find-and-replace that lands mid-sentence breaks no link and deletes no file, so every
      # other check passes and the damage ships. 16 files shipped that way in one commit.
      - name: No splice damage from a find-and-replace
        run: python scripts/check-splice-damage.py

      - name: References resolve, match root, and are cited
        run: bash scripts/check-references.sh

      - name: Per-skill reference copies are in sync with the root
        # sync-references.sh is generative. If running it changes anything,
        # someone edited a root reference without re-syncing, and the installed
        # copy of that skill would ship stale text.
        run: |
          bash scripts/sync-references.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "Per-skill reference copies are stale. Run scripts/sync-references.sh and commit."
            git --no-pager diff --stat
            exit 1
          fi
